version: '3.8'

services:
    backend:
        build: .
        ports:
            - '5001:5001'
        environment:
            - DB_HOST=db
            - DB_USER=root
            - DB_PASSWORD=password
            - DB_NAME=testdb
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./src:/app/src
        restart: unless-stopped

    db:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: testdb
            MYSQL_USER: user
            MYSQL_PASSWORD: password
        ports:
            - '3306:3306'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-u',
                    'root',
                    '-ppassword',
                ]
            interval: 5s
            timeout: 10s
            retries: 20
        command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M --performance-schema=OFF

volumes:
    mysql-data:
